<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рекламные площадки</title>
  <style>
    :root { --bg:#f5f7fa; --panel:#fff; --text:#17202c; --muted:#667085; --line:#d8dee6; --blue:#2458d3; --blue-soft:#eef4ff; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
    .top { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 18px 12px; }
    .brand { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .brand strong { font-size:18px; }
    .brand span { color:var(--muted); font-size:13px; }
    .platform-tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .platform-tab { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:8px; padding:9px 13px; cursor:pointer; font-size:14px; font-weight:700; }
    .platform-tab.active { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
    iframe { width:100%; flex:1; border:0; background:var(--bg); }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><strong>Рекламные площадки</strong><span id="platform-note">Выберите проект</span></div>
    <nav class="platform-tabs">
      <button class="platform-tab" data-platform="telegram">Telegram Ads</button>
      <button class="platform-tab" data-platform="telegram-stars">Telegram Ads ⭐</button>
      <button class="platform-tab" data-platform="avito">Авито</button>
    </nav>
  </div>
  <iframe id="frame" title="Дашборд площадки"></iframe>
  <script>
    const PLATFORMS = {
      telegram: { title: 'Telegram Ads', src: 'telegram_ads_dashboard.html?v=1784624454580' },
      'telegram-stars': { title: 'Telegram Ads ⭐', src: 'telegram_ads_stars_dashboard.html?v=1784624454580' },
      avito: { title: 'Авито', src: 'avito_dashboard.html?v=1784624454580' }
    };
    const frame = document.getElementById('frame');
    const note = document.getElementById('platform-note');
    function currentPlatform() {
      const hash = (location.hash || '').replace('#', '');
      return PLATFORMS[hash] ? hash : 'telegram';
    }
    function render() {
      const platform = currentPlatform();
      document.querySelectorAll('.platform-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.platform === platform);
      });
      note.textContent = PLATFORMS[platform].title;
      document.title = PLATFORMS[platform].title + ' - рекламные площадки';
      if (!frame.src.endsWith(PLATFORMS[platform].src)) frame.src = PLATFORMS[platform].src;
    }
    document.querySelectorAll('.platform-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        if (location.hash !== '#' + btn.dataset.platform) location.hash = btn.dataset.platform;
        render();
      });
    });
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
